# =============================================================================
# /etc/sysctl.d/99-gameserver.conf
# Network & kernel tuning for game servers (Source Engine, etc.)
#
# APPLY ON THE DOCKER HOST (not inside the container):
#   sudo cp sysctl-gameserver.conf /etc/sysctl.d/99-gameserver.conf
#   sudo sysctl --system
#
# Or apply immediately without reboot:
#   sudo sysctl -p /etc/sysctl.d/99-gameserver.conf
# =============================================================================

# --- UDP buffers (critical for SRCDS — it's UDP-heavy) -----------------------
# Default: 212992 (208 KB). Raise to 25 MB for burst handling.
net.core.rmem_default = 26214400
net.core.wmem_default = 26214400
# Maximum socket buffer sizes — 64 MB
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# --- TCP buffers (for RCON, web panels, SourceTV relay) ----------------------
# min / default / max in bytes
net.ipv4.tcp_rmem = 4096 524288 67108864
net.ipv4.tcp_wmem = 4096 524288 67108864

# --- Network device queue (prevents drops under burst load) ------------------
# Default: 1000. Raise to 5000 for game servers.
net.core.netdev_max_backlog = 5000

# --- Connection backlog -------------------------------------------------------
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# --- TCP congestion control (BBR = better latency on game traffic) -----------
# Requires kernel ≥ 4.9 — Ubuntu 24.04 ships 6.x, so this always works.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- Reduce TCP latency (disable Nagle — game servers send small packets) ----
net.ipv4.tcp_nodelay = 1

# --- Ephemeral port range (more ports available for outgoing connections) -----
net.ipv4.ip_local_port_range = 1024 65535

# --- TIME_WAIT recycling (faster reuse of ports after disconnect) -------------
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# --- Keep-alive tuning -------------------------------------------------------
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# --- Connection tracking (for many simultaneous players) ---------------------
net.netfilter.nf_conntrack_max = 131072
net.netfilter.nf_conntrack_tcp_timeout_established = 300

# --- Increase maximum number of open files system-wide -----------------------
fs.file-max = 2097152

# --- Virtual memory (prevent OOM-kill on game servers) -----------------------
vm.swappiness = 10
vm.overcommit_memory = 1

# --- Protect against SYN flood attacks (common on game servers) --------------
net.ipv4.tcp_syncookies = 1

# --- IPv6 (disable if not needed, reduces attack surface) --------------------
# Uncomment to disable IPv6:
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1
