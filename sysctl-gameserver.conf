# =============================================================================
# /etc/sysctl.d/99-gameserver.conf
# Host-side tuning for Source engine game servers on modern Linux kernels.
#
# Apply on the Docker host, not inside the container:
#   sudo cp sysctl-gameserver.conf /etc/sysctl.d/99-gameserver.conf
#   sudo sysctl --system
# =============================================================================

# Larger socket buffers help smooth bursty UDP traffic and reduce packet drops.
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.udp_rmem_min = 262144
net.ipv4.udp_wmem_min = 262144

# Allow the NIC queue to absorb short traffic spikes without excessive drops.
net.core.netdev_max_backlog = 8192

# TCP is secondary for TF2 gameplay, but these help RCON, FastDL and panel traffic.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

# Faster recovery and lower queue buildup for short-lived control-plane connections.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# Keep enough ephemeral ports available for outbound traffic and relays.
net.ipv4.ip_local_port_range = 10240 65535

# Sensible conntrack and file limits for busy public servers.
net.netfilter.nf_conntrack_max = 262144
fs.file-max = 2097152

# Conservative VM settings to reduce reclaim spikes under load.
vm.swappiness = 10
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.max_map_count = 262144

# Basic SYN flood protection without aggressive game-traffic side effects.
net.ipv4.tcp_syncookies = 1
