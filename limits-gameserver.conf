# =============================================================================
# /etc/security/limits.d/99-gameserver.conf
# File descriptor and process limits for game server user "container"
# =============================================================================

# Open file descriptors — SRCDS + SourceMod open many files
container    soft    nofile    65536
container    hard    nofile    65536

# Core dumps (useful for crash debugging)
container    soft    core      unlimited
container    hard    core      unlimited

# Max user processes
container    soft    nproc     8192
container    hard    nproc     8192

# Stack size
container    soft    stack     8192
container    hard    stack     unlimited
