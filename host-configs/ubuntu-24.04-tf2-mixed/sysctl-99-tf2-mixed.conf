# Mixed workload host tuning:
# 6x TF2 + Docker FastDL + host nginx/PHP/MariaDB
#
# Important:
# Per-container / per-port traffic priority is not done via sysctl.
# Use the separate tf2-qos service/script for tc + iptables marking.

# Memory pressure
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# File descriptors
fs.file-max = 2097152

# Queueing and congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Socket buffers
# Slightly larger defaults are fine on a gaming-oriented provider with good uplink.
net.core.rmem_default = 2097152
net.core.wmem_default = 2097152
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.udp_rmem_min = 262144
net.ipv4.udp_wmem_min = 262144

# Backlogs
net.core.netdev_max_backlog = 8192
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# TCP control-plane traffic: panel, RCON, FastDL, web
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# Port range and conntrack
net.ipv4.ip_local_port_range = 10240 65535
net.netfilter.nf_conntrack_max = 262144

# Basic SYN flood protection
net.ipv4.tcp_syncookies = 1
