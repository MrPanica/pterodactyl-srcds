services:
  fastdl:
    image: nginx:1.28-alpine
    container_name: fastdl
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8081:80"
    cpuset: "0"
    mem_limit: 384m
    memswap_limit: 384m
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - /srv/fastdl:/usr/share/nginx/html:ro
      - ./fastdl-nginx.conf:/etc/nginx/nginx.conf:ro
