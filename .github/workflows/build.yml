name: Build and Push - srcds-lts

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "sysctl-gameserver.conf"
      - "limits-gameserver.conf"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/steamcmd

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "24.04"
            libicu_pkg: "libicu74"
            tags: |
              type=raw,value=ubuntu_24.04
              type=raw,value=ubuntu_24.04_srcds
              type=raw,value=srcds-noble
          - ubuntu_version: "26.04"
            libicu_pkg: "libicu78"
            tags: |
              type=raw,value=ubuntu_26.04
              type=raw,value=ubuntu_26.04_srcds
              type=raw,value=srcds-resolute

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ matrix.tags }}
            type=sha,prefix=sha-,suffix=-ubuntu-${{ matrix.ubuntu_version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            LIBICU_PKG=${{ matrix.libicu_pkg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ubuntu-${{ matrix.ubuntu_version }}
          cache-to: type=gha,mode=max,scope=ubuntu-${{ matrix.ubuntu_version }}
